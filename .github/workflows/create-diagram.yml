name: Repo visualizer
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  get_data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Update diagram
        uses: githubocto/repo-visualizer@main
        with:
          output_file: "diagram.svg"
          excluded_paths: "node_modules,dist,.git"
